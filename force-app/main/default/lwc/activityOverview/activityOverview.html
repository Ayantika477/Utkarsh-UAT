<template>
    <lightning-card title="Activity Overview" icon-name="standard:task">
        <div class="slds-p-horizontal_small">
            <template if:true={loading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <template if:true={error}>
                <div class="slds-text-color_error slds-p-around_small">{error}</div>
            </template>
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <div class="slds-text-heading_small slds-p-vertical_x-small">{openTitle}</div>
                    <template if:true={hasOpen}>
                        <c-activity-overview-datatable
                            key-field="id"
                            data={openRows}
                            columns={openColumns}
                            hide-checkbox-column
                            show-row-number-column>
                        </c-activity-overview-datatable>
                    </template>
                    <template if:false={hasOpen}>
                        <div class="slds-text-color_weak slds-p-around_small">No upcoming or overdue activities.</div>
                    </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <div class="slds-text-heading_small slds-p-vertical_x-small">{completedTitle}</div>
                    <template if:true={hasCompleted}>
                        <c-activity-overview-datatable
                            key-field="id"
                            data={completedRows}
                            columns={completedColumns}
                            hide-checkbox-column
                            show-row-number-column>
                        </c-activity-overview-datatable>
                    </template>
                    <template if:false={hasCompleted}>
                        <div class="slds-text-color_weak slds-p-around_small">No completed activities yet.</div>
                    </template>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
